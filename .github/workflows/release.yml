# Builds the mod and the editor on GitHub's own Windows machine and publishes them as a release.
#
# Pushing a tag that starts with "v" (v0.1.0-beta, v1.0.0, ...) builds that commit with build.cmd,
# packs it with tools\package.ps1 (the same zip as on your PC: no settings, logs or anything naming
# the PC it was built on) and publishes it as a release with the zip attached. A tag with a "-" in
# it (v0.1.0-beta, v1.0.0-rc1) becomes a pre-release. The release text is
# docs\releases\<tag>.md if there is one, else GitHub's list of the commits since the last release.
#
# Run it by hand (Actions > Release > Run workflow) for a test build of a branch: the zip is kept
# with the run for a few days and nothing is published.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write  # to publish the release

jobs:
  release:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
    steps:
      - uses: actions/checkout@v5

      - name: Install the .NET 10 SDK (for the editor)
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build and package
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "test-$($env:GITHUB_SHA.Substring(0, 7))" }
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\package.ps1 -Build -Version $version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Keep the zip with the run
        uses: actions/upload-artifact@v5
        with:
          name: RFA-Mod-${{ env.VERSION }}
          path: dist/RFA-Mod/

      - name: Publish the release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = @($env:VERSION, "dist/RFA-Mod-$env:VERSION.zip", '--title', "RFA-Mod $env:VERSION")
          $notes = "docs/releases/$env:VERSION.md"
          if (Test-Path $notes) { $release += @('--notes-file', $notes) } else { $release += '--generate-notes' }
          if ($env:VERSION -like '*-*') { $release += '--prerelease' }
          gh release create @release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
