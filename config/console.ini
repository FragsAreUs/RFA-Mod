; Console settings the console mod applies for you (the developer console opens with the ` key).
; Keep comments on their own lines.
;
; Each line is <console name>=<value>. Names are the console's own; to find them, open the
; console and type: search <part of a name>
;   On/off settings (the console lists them as "Toggles ..."): 1 = on, 0 = off.
;   Number settings ("Sets ..."): the number, e.g. Camera_43_fov_modifier=1.125
;   Commands: 1 = on, 0 = off for commands that switch something; otherwise the value the
;             command takes, or nothing after = to just run it once.
; A few commands ignore 1 / 0 and switch every time they run (show_fps, show_lighting_stats).
; Every setting applied, or skipped with the reason, is written to logs\rfa_mods.log.

[Startup]
; Applied once, when the game has finished starting (before the main menu).

; The beta's performance text in the top-left corner: 0 hides it, 1 shows it.
Show_framerate_stats=0

[Gameplay]
; Applied every time gameplay starts after loading a level, a save or a checkpoint.
