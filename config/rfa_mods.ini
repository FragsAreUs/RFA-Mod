; Red Faction: Armageddon mod config.
; Keep comments on their own lines (Windows ini parsing does not strip trailing comments).
; The mods are written for the Steam "publicbeta" branch (Steam > Properties > Game Versions &
; Betas). On other builds, mods that patch game code leave it alone and say so in the log.

[Launcher]
; The folder of your copy of the game (the one with RedFactionArmageddon_DX11.exe), wherever it
; is installed: a Steam library, GOG, or anywhere else. For example
;   GameDir=D:\Games\Red Faction Armageddon
; Leave it empty if you copied the mod files into the game folder itself. The editor fills it in
; when you choose the game folder there.
GameDir=
; RedFactionArmageddon_DX11.exe = DirectX 10/11 renderer
GameExe=RedFactionArmageddon_DX11.exe
; Command-line arguments passed to the game. Keep -packfiles: the official launcher passes it,
; and without it the game looks for loose dev files and crashes on its first frames.
GameArgs=-packfiles
; 1 = launcher waits for the game to exit (keeps Steam playtime and overlay tracking right)
WaitForExit=1

[Loader]
; 1 = if the game crashes, log where and write logs\crash-<date>-<time>.dmp
CrashReports=1
; 1 = files in overrides\ replace the game's own files inside its archives. overrides\ mirrors
;     the game folder (see overrides\README.md). Used for the FOV slider in Options > Gameplay
Overrides=1
; 1 = log every lookup of a level's files (zones, archives, containers, terrain), to see which
;     files a level loads
LogLookups=0

[Mods]
; Every DLL in the mods folder loads unless it is set to 0 here
borderless=1
fov=1
; the game loads and saves its video settings from video_settings.cfg (its own save always failed)
video_settings=1
; developer console improvements (mouse wheel scrolling); the console itself opens with the ` key
console=1

[Borderless]
; Set the game to Windowed (Options > Display). This mod turns that window into borderless
; fullscreen. While the game is in its own exclusive Fullscreen mode, the mod leaves it alone.
; 1 = borderless fullscreen. 0 = leave the game alone and only log what it does (troubleshooting)
Enabled=1
; 0 = primary monitor. 1, 2, ... pick a specific monitor (they are listed in logs\rfa_mods.log)
Monitor=0
; 1 = alt-tab without the game minimizing or switching modes. The game pauses as always; the mod
;     frees the cursor and mutes keyboard/controller while you are away.
; 0 = the game's own behaviour: it drops to a small window and minimizes when it loses focus.
IgnoreFocusLoss=1
; 1 = the Windows key works while playing (Start menu, Win+Shift+S, ...). 0 = the game blocks it
;     while you play, as it normally does. Either way it works once you're in another app.
AllowWindowsKey=1
; 1 = render at true resolution on displays using Windows scaling (125%, 150%, ...)
DpiAware=1

[FOV]
; Vertical field of view in degrees, 30-170. The game's own is 45. Every camera is capped at 170:
; at 180 the picture turns inside out.
; Also a slider in Options > Gameplay (45-170), which changes it while you play.
; On a 16:9 screen: 45 = 73 horizontal, 60 = 91, 90 = 121, 120 = 144, 150 = 163, 170 = 174
VerticalFov=60
; 1 = also widen vehicles and exo-suits (the community FOV fix could only do on foot)
Vehicles=1
