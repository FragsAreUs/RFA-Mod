; =================================================================================================
;  RFA-Mod settings
; =================================================================================================
;  Each setting is name=value; for switches 1 = on and 0 = off. Comments go on lines of their own,
;  starting with ; (anything after a value on the same line becomes part of the value).
;  The mods are made for the Steam "publicbeta" branch of the game (Steam > the game's Properties >
;  Game Versions & Betas). On other builds they leave the game alone and say so in
;  logs\rfa_mods.log.


; -------------------------------------------------------------------------------------------------
;  Where your games are, and how the game is started
; -------------------------------------------------------------------------------------------------
[Launcher]
; Your copy of Red Faction: Armageddon: the folder with RedFactionArmageddon_DX11.exe, wherever it
; is (Steam, GOG or anywhere else). Leave it empty if you put RFA-Mod in the game folder itself.
; The editor fills it in when you choose the game folder there. For example
;   GameDir=D:\Games\Red Faction Armageddon
GameDir=
; Your copy of Red Faction: Guerrilla (Steam Edition), only for building the Guerrilla world and
; its HUD: editor\GuerrillaWorld.exe and editor\GuerrillaHud.exe read your game files from here.
; The game starts without it. The folder with build\pc\cache in it, for example
;   GuerrillaDir=D:\Games\Red Faction Guerrilla
GuerrillaDir=
; The game's program: RedFactionArmageddon_DX11.exe is its DirectX 10/11 renderer.
GameExe=RedFactionArmageddon_DX11.exe
; What the game is started with. Keep -packfiles: the official launcher passes it, and without it
; the game looks for loose dev files and crashes on its first frames.
GameArgs=-packfiles
; 1 = the launcher waits for the game to exit (keeps Steam's playtime and overlay right)
WaitForExit=1


; -------------------------------------------------------------------------------------------------
;  The loader, which starts the mods inside the game
; -------------------------------------------------------------------------------------------------
[Loader]
; 1 = if the game crashes, log where, and write logs\crash-<date>-<time>.dmp
CrashReports=1
; 1 = files in overrides\ replace the game's own (overrides\ mirrors the game folder; see
;     overrides\README.md). The FOV slider in Options > Gameplay, the Guerrilla world and its HUD
;     all need this.
Overrides=1
; 1 = log every file a level looks up (zones, archives, containers, terrain), to see which files a
;     level loads
LogLookups=0


; -------------------------------------------------------------------------------------------------
;  Which mods load: every DLL in mods\ loads unless it is set to 0 here
; -------------------------------------------------------------------------------------------------
[Mods]
; Borderless fullscreen and a clean alt-tab; see [Borderless]
borderless=1
; A wider field of view; see [FOV]
fov=1
; The game keeps its video settings in video_settings.cfg (its own save always failed)
video_settings=1
; Developer console improvements (mouse wheel scrolling); the console opens with the ` key
console=1
; The sky, light, clock, view distance and zone size of the world ported from Red Faction:
; Guerrilla; see [GuerrillaWorld]
guerrilla_world=1
; Red Faction: Guerrilla's HUD in that world; see [GuerrillaHud]
guerrilla_hud=1


; -------------------------------------------------------------------------------------------------
;  borderless
; -------------------------------------------------------------------------------------------------
[Borderless]
; Set the game to Windowed (Options > Display), and this turns its window into borderless
; fullscreen. In the game's own exclusive Fullscreen mode it leaves the game alone.
; 1 = borderless fullscreen. 0 = leave the game alone and only log what it does (troubleshooting)
Enabled=1
; 0 = the primary monitor. 1, 2, ... = another one (logs\rfa_mods.log lists them)
Monitor=0
; 1 = alt-tab without the game minimizing or changing mode. The game pauses as always; the mod
;     frees the cursor and mutes the keyboard and controller while you're away.
; 0 = the game's own way: it drops to a small window and minimizes when it loses focus.
IgnoreFocusLoss=1
; 1 = the Windows key works while you play (Start menu, Win+Shift+S, ...).
; 0 = the game blocks it while you play, as it normally does. Either way it works in other apps.
AllowWindowsKey=1
; 1 = render at the true resolution on displays with Windows scaling (125%, 150%, ...)
DpiAware=1


; -------------------------------------------------------------------------------------------------
;  fov
; -------------------------------------------------------------------------------------------------
[FOV]
; The vertical field of view in degrees, 30-170 (the game's own is 45). Also a slider in
; Options > Gameplay (45-170), which changes it while you play. Every camera stops at 170: at 180
; the picture turns inside out.
; On a 16:9 screen, vertical = horizontal: 45 = 73, 60 = 91, 90 = 121, 120 = 144, 150 = 163,
; 170 = 174
VerticalFov=60
; 1 = also widen vehicles and exo-suits (the community FOV fix could only do on foot)
Vehicles=1


; -------------------------------------------------------------------------------------------------
;  guerrilla_world: the world ported from Red Faction: Guerrilla
; -------------------------------------------------------------------------------------------------
[GuerrillaWorld]
; editor\GuerrillaWorld.exe builds the world from your own copy of Guerrilla (GuerrillaDir under
; [Launcher]). Settings marked (live) change straight away when you save this file while the game
; runs, so you can tune them while looking at them; the rest are read when the game starts.
; The worlds all this is for, by name: rfg is the Guerrilla world (its zones are rfg_XX_YY).
; Separate several with commas.
Worlds=rfg

; --- Sky
; 1 = draw Guerrilla's sky, a dome coloured by the time of day. Armageddon draws no such sky for
;     its worlds; their sky is an effect the level places.
Sky=1
; 1 = and Guerrilla's clouds and far mountains over it. They need mods\guerrilla_world\ (the cloud
;     model and textures, made from your copy of Guerrilla along with the world); without it the
;     sky is drawn alone.
Clouds=1
; (live) How bright the sky is: its time-of-day colours times this.
Brightness=5

; --- Light and the time of day
; 1 = light the world as Guerrilla's day and night do: the sky's light from above and below, and
;     the sun's (by night the moon's) along its path over the day. Armageddon lights the ground
;     only with lamps its levels place, so without this the world is dark.
Light=1
; (live) How bright the sky's light is: the time of day's ambient light times this.
Ambient=1
; (live) How bright the sun and moon are: the time of day's light colour times this.
Sun=1
; (live) How fast the day goes by: game seconds for each real second (48 = a day in half an hour,
; 1 = real time). 0 = leave the clock alone. Armageddon's own clock stands still; it gets its old
; speed back in every other world.
ClockSpeed=48

; --- Size and view distance
; How wide the zones are, in metres. The world is built with Guerrilla's own zones, 511 m
; (Armageddon's are 255 m; the game already knows Guerrilla's size), so Guerrilla's whole map
; fits. Only change it to match how the world was built. 0 = the game's own. When the game starts
; this also widens the game's physics world (for every world) to hold that many zones.
ZoneSize=511
; (live) How far around you whole zones stay loaded, in metres, with their far-away ground.
; Armageddon keeps only the zones next to you (its levels are walled canyons), so past them the
; ground just stops. 500 keeps the 3 x 3 zones around you loaded, as Guerrilla does. At most just
; under two zones (the game can only track so many at once; more is lowered), but 5 x 5 zones need
; far more memory than the game gives a level. 0 = the game's own.
StreamRadius=500


; -------------------------------------------------------------------------------------------------
;  guerrilla_hud: Red Faction: Guerrilla's HUD in the Guerrilla world
; -------------------------------------------------------------------------------------------------
[GuerrillaHud]
; Guerrilla's HUD in place of Armageddon's: so far its health meter and the blood that creeps in
; from the screen's corners. Armageddon's health ring, red screen edges and compass bar are hidden
; there (the top middle is where Guerrilla's health meter goes; Guerrilla's minimap comes later).
; Every other world keeps Armageddon's HUD.
; editor\GuerrillaHud.exe makes it from your own copy of Guerrilla (GuerrillaDir under
; [Launcher]): run it once, and again after updating RFA-Mod; until then this mod only says so in
; the log. editor\GuerrillaHud.exe --remove takes it away again.
; The worlds it's shown in, by name: rfg is the Guerrilla world. Separate several with commas.
Worlds=rfg
; Which of Guerrilla's HUD documents to show there, separated by commas: so far rfg_ui_hud_health
; (the health meter and the blood). GuerrillaHud.exe makes each of them.
Documents=rfg_ui_hud_health

; --- Troubleshooting (read when a HUD document loads)
; 1 = write what Guerrilla's HUD scripts find, and every health update they get, to
;     logs\rfa_mods.log
Log=0
; 1 = show Guerrilla's HUD all the time, whatever the health (the blood bright red, the meter at
;     half length), to see whether it's drawn at all. 0 = as the game goes
Test=0
