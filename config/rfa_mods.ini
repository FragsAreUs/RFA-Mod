; =================================================================================================
;  RFA-Mod settings
; =================================================================================================
;  Each setting is name=value; for switches 1 = on and 0 = off. Comments go on lines of their own,
;  starting with ; (anything after a value on the same line becomes part of the value).
;  The mods are made for the Steam "publicbeta" branch of the game (Steam > the game's Properties >
;  Game Versions & Betas). On other builds they leave the game alone and say so in
;  logs\rfa_mods.log.


; -------------------------------------------------------------------------------------------------
;  Where your games are, and how the game is started
; -------------------------------------------------------------------------------------------------
[Launcher]
; Your copy of Red Faction: Armageddon: the folder with RedFactionArmageddon_DX11.exe, wherever it
; is (Steam, GOG or anywhere else). Leave it empty if you put RFA-Mod in the game folder itself.
; The editor fills it in when you choose the game folder there. For example
;   GameDir=D:\Games\Red Faction Armageddon
GameDir=
; Your copy of Red Faction: Guerrilla (Steam Edition), only for building the Guerrilla world and
; what goes with it: editor\GuerrillaBuilder.exe reads your game files from here (and fills this in
; when you choose the folder there). The game starts without it. The folder with build\pc\cache in
; it, for example
;   GuerrillaDir=D:\Games\Red Faction Guerrilla
GuerrillaDir=
; The game's program: RedFactionArmageddon_DX11.exe is its DirectX 10/11 renderer.
GameExe=RedFactionArmageddon_DX11.exe
; What the game is started with. Keep -packfiles: the official launcher passes it, and without it
; the game looks for loose dev files and crashes on its first frames.
GameArgs=-packfiles
; 1 = the launcher waits for the game to exit (keeps Steam's playtime and overlay right)
WaitForExit=1
; 1 = the game gets 4 GB of memory to work in instead of 2 (the Guerrilla world needs the room).
;     Windows only gives a 32-bit game that much when its program is marked "large address aware",
;     and the game's isn't, so the launcher keeps a copy of it in large_address\ (only that mark
;     changed; made again whenever the game updates) and starts the game from the copy, in the game
;     folder as before. Your game folder is still never changed. 0 = start the game's own program.
LargeAddressAware=1


; -------------------------------------------------------------------------------------------------
;  The loader, which starts the mods inside the game
; -------------------------------------------------------------------------------------------------
[Loader]
; 1 = if the game crashes, log where, and write logs\crash-<date>-<time>.dmp
CrashReports=1
; 1 = files in overrides\ replace the game's own (overrides\ mirrors the game folder; see
;     overrides\README.md). The FOV slider in Options > Gameplay, the Guerrilla world and its HUD
;     all need this.
Overrides=1
; Troubleshooting. logs\rfa_mods.log always has the mods' problems (errors, warnings, crashes, the
; game's own reports), which the console shows too, and a line or two from each part as it starts
; (the game's build, the DLLs and parts running), marked [module:info]. Each mod's Log= (here, and in
; its own section below) adds everything else: what it found and set up, what happens in play (an
; activity won, a district liberated), reports every few seconds, a line for each file, spawn, sound
; or path. Those go to the log only, marked [module:log], never to the console. Turn one on when
; chasing a fault; off, they cost nothing.
; 1 = the loader and rfa_qol.dll (borderless, console, video settings, Spawn) write their routine
;     lines: each file in overrides\ and each one the game is given from there, each Lua script,
;     each window message the borderless part sees, and what the game's scripts write with rfa_log
Log=0
; With Log=1: 1 = also log every file a level looks up (zones, archives, containers, terrain), to see
;     which files a level loads
LogLookups=0
; For mod makers: 1 = every 30 s, logs\rfa_mods.log gets how much of the game's main and render threads'
;     time the mods' code took ([profile:log] lines), sampled every 2 ms. It costs about 1% of a frame
;     while on. The addresses it lists are offsets into our DLLs; building from the source, build.cmd
;     writes a .map file next to each DLL that names them.
Profile=0
; The key that opens and closes the in-game menus (Spawn, Limits, ...) without the console: F1-F12,
; Insert, Home, End, PageUp, PageDown, Delete, Pause, or a letter or digit. Empty = only with the
; console open (the ` key).
MenuKey=F7


; -------------------------------------------------------------------------------------------------
;  Which mods load: every mod in mods\ loads unless it is set to 0 here
; -------------------------------------------------------------------------------------------------
[Mods]
; The first seven are the parts of mods\rfa_qol.dll, each with its own switch.
; Borderless fullscreen and a clean alt-tab; see [Borderless]
borderless=1
; A wider field of view; see [FOV]
fov=1
; The game keeps its video settings in video_settings.cfg (its own save always failed)
video_settings=1
; A clearer developer console that keeps all its output, and console.ini; see [Console]. The
; console opens with the ` key
console=1
; Spawn in the in-game menus: windows to spawn any vehicle, drop items, give weapons and remove
; what you spawned. Open the console, then Spawn in the bar along the bottom of the screen
spawner=1
; Limits in the in-game menus: how full the engine's fixed tables are (vehicles, animations, ...)
limits=1
; Graphics in the in-game menus: sliders and switches for the ported world's picture (the (live)
; settings under [GuerrillaWorld]), saved to this file as you change them
graphics=1
; Animations of your own: each .anim_pc in mods\animations (the Blender add-on's "Export to Game"
; writes there) is used in place of the game's animation of that name, wherever the game keeps it
; (anims.vpp_pc, a level's or a vehicle's container), or added as a new one, from the game's start
animations=1
; Tables of your own: each .xtbl in mods\tables is handed to the game in place of its table of that
; name when it reads its tables while starting (vehicles.xtbl, vehicle_interactions.xtbl, the anim
; lists...), or as a new one. The Blender add-on writes there (built vehicles, vehicle animations);
; a table the Guerrilla world has (mods\guerrilla_world\) is that one's instead
tables=1
; The nine guerrilla_ ones below are the parts of mods\rfa_guerrilla.dll, each with its own switch.
; The sky, light, clock, view distance and zone size of the world ported from Red Faction:
; Guerrilla; see [GuerrillaWorld]
guerrilla_world=1
; Red Faction: Guerrilla's HUD in that world; see [GuerrillaHud]
guerrilla_hud=1
; What Red Faction: Guerrilla's vehicles need to be driven; see [GuerrillaVehicles]
guerrilla_vehicles=1
; What Red Faction: Guerrilla's people need in that world; see [GuerrillaPeople]. It also gives the
; game room for the animations' names: once editor\GuerrillaBuilder.exe has made the people, take
; them away there (Remove) before setting this to 0, or the game stops while it starts
; ("Length of string pool exceeded"). The people's animations also need guerrilla_vehicles and
; guerrilla_gear on (they give the game room for more animations and sets)
guerrilla_people=1
; What Red Faction: Guerrilla's weapons need in that world (room for more inventory items, their
; player animations and room for those, their dropped guns, Mason's sledgehammer always in his hands'
; slot 3 and never swapped away), and the player turning to face where he walks and runs (Darius and
; Mason; aiming and attacking still face the camera); the weapons come from
; editor\GuerrillaBuilder.exe: take them away there (Remove) before setting this to 0
guerrilla_gear=1
; Saving in that world: the pause menu's SAVE GAME saves the moment you are in; see [GuerrillaSave]
guerrilla_save=1
; Red Faction: Guerrilla's alert level in that world: it rises when the EDF sees you and loses people
; and vehicles, and falls again once you get away; see [GuerrillaCampaign]
guerrilla_campaign=1
; Red Faction: Guerrilla's EDF news kiosks in that world: the pictures on their screens and the EDF's
; news broadcast; see [GuerrillaKiosks]
guerrilla_kiosks=1
; Red Faction: Guerrilla's people's voices in that world: each person speaks as one of their
; character's voices, by Guerrilla's rules for each line; see [GuerrillaVoices]
guerrilla_voices=1
; mods\rfa_sound.dll: RFA-Mod's own sound engine, on OpenAL Soft, for the sound banks [Audio] names; it
; does nothing until [Audio] OwnPlayer=1
rfa_sound=1


; -------------------------------------------------------------------------------------------------
;  borderless
; -------------------------------------------------------------------------------------------------
[Borderless]
; Set the game to Windowed (Options > Display), and this turns its window into borderless
; fullscreen. In the game's own exclusive Fullscreen mode it leaves the game alone.
; 1 = borderless fullscreen. 0 = leave the game alone and only log what it does (troubleshooting,
;     with Log=1 under [Loader])
Enabled=1
; 0 = the primary monitor. 1, 2, ... = another one (logs\rfa_mods.log lists them)
Monitor=0
; 1 = alt-tab without the game minimizing or changing mode. The game pauses as always; the mod
;     frees the cursor and mutes the keyboard and controller while you're away.
; 0 = the game's own way: it drops to a small window and minimizes when it loses focus.
IgnoreFocusLoss=1
; 1 = the Windows key works while you play (Start menu, Win+Shift+S, ...).
; 0 = the game blocks it while you play, as it normally does. Either way it works in other apps.
AllowWindowsKey=1
; 1 = render at the true resolution on displays with Windows scaling (125%, 150%, ...)
DpiAware=1


; -------------------------------------------------------------------------------------------------
;  fov
; -------------------------------------------------------------------------------------------------
[FOV]
; The vertical field of view in degrees, 30-170 (the game's own is 45). Also a slider in
; Options > Gameplay (45-170), which changes it while you play. Every camera stops at 170: at 180
; the picture turns inside out.
; On a 16:9 screen, vertical = horizontal: 45 = 73, 60 = 91, 90 = 121, 120 = 144, 150 = 163,
; 170 = 174
VerticalFov=60
; 1 = also widen vehicles and exo-suits (the community FOV fix could only do on foot)
Vehicles=1


; -------------------------------------------------------------------------------------------------
;  console: the developer console (the ` key)
; -------------------------------------------------------------------------------------------------
[Console]
; How much of the screen it covers, in percent (the game's own: 40). While the render debug panel
; (` + X) is up, it moves to the bottom of the screen, below the panel.
Height=50
; The size of its text and of the line you type, times the console font's size (1 = the game's
; own; whole numbers look sharpest). On screens taller than 1080 lines both grow to match.
TextScale=1.25
InputScale=1.5
; How dark the panel behind it is, 0-100 (the game's own is a light 50). The console's own
; console_set_bg_color <r> <g> <b> <a> still changes it while you play.
Opacity=85
; Lines it keeps for scrolling back, 256-200000 (the game kept 256)
HistoryLines=10000
; 1 = also write everything it prints to logs\console.log (started afresh each time the game starts)
LogToFile=1
; 1 = while it is shut, the last 4 lines it printed show at the top left of the screen for 3
;     seconds, as in Quake 3 (the game itself kept nothing it printed while the console was shut)
Notify=1
; 1 = a build stamp just above the line you type: the game's version, Steam build, internal name
;     and the day it was built, and RFA-Mod's version
BuildStamp=1
; 1 = also show what the game writes only for its developers: its debug output (what it loads,
;     what it couldn't) and the error reports it flashes on the screen, marked [game]
GameLog=1
; 1 = also show the mods' problems from RFA-Mod's own log (logs\rfa_mods.log) as they're written,
;     each line starting with the mod's name: errors, warnings and the game's reports. Everything
;     else in that log (each part's start-up line, and the routine lines their Log= switches add)
;     stays in the file only.
ModLog=1


; -------------------------------------------------------------------------------------------------
;  guerrilla_world: the world ported from Red Faction: Guerrilla
; -------------------------------------------------------------------------------------------------
[GuerrillaWorld]
; editor\GuerrillaBuilder.exe builds the world from your own copy of Guerrilla (GuerrillaDir under
; [Launcher]). Settings marked (live) change straight away when you save this file while the game
; runs, so you can tune them while looking at them; the rest are read when the game starts.
; The worlds all this is for, by name: rfg is the Guerrilla world (its zones are rfg_XX_YY).
; Separate several with commas.
Worlds=rfg

; --- Sky
; 1 = draw Guerrilla's sky, a dome coloured by the time of day. Armageddon draws no such sky for
;     its worlds; their sky is an effect the level places.
Sky=1
; 1 = and Guerrilla's clouds and far mountains over it. They need mods\guerrilla_world\ (the cloud
;     model and textures, made from your copy of Guerrilla along with the world); without it the
;     sky is drawn alone.
Clouds=1
; (live) How bright the sky is: its time-of-day colours times this. With Guerrilla's tone mapping
;     (ToneMapping=1) 5 is Guerrilla's own brightness.
Brightness=5

; --- Light and the time of day
; 1 = light the world as Guerrilla's day and night do: the sky's light from above and below, and
;     the sun's (by night the moon's) along its path over the day. Armageddon lights the ground
;     only with lamps its levels place, so without this the world is dark.
Light=1
; (live) How bright the sky's light is: the time of day's ambient light times this.
Ambient=1
; (live) How bright the sun and moon are: the time of day's light colour times this.
Sun=1
; (live) How strong the sun's highlights on surfaces are (their specular maps): 1 = as drawn now,
;     0 = none.
Shine=1
; (live) With ToneMapping=1, how strong the glow round bright things is: 1 = as drawn now, 0 = none.
Bloom=1
; (live) 1 = the sun and moon cast shadows, so the insides of buildings are no longer lit as if
;     outdoors. Armageddon draws no light from one direction over the whole map, so the mod moves
;     the game's own shadow lamp (the one its outdoor maps keep over the player) with the sun and draws
;     the sun's light through that lamp's shadow map. 0 = they light through everything.
SunShadows=1
; (live) 1 = the clouds cast shadows that drift over the ground with them, as in Re-Mars-tered.
;     Needs SunShadows=1 and Clouds=1. 0 = none.
CloudShadows=1
; (live) 1 = Guerrilla's colour correction: its time of day's tint (bluish) over the light, sky,
;     clouds and far mountains, which turns its pink light into Guerrilla's colours. 0 = without
;     it (pink).
ColourCorrection=1
; (live) How thick Guerrilla's fog is: its haze, thicker low down and far away, district by
;     district and over the day. 1 = Guerrilla's, 0 = no fog. (Rebuild the world after updating so
;     Armageddon's own fog stays off there.)
Fog=1
; (live) 1 = Guerrilla's tone mapping: the picture's brightness adapts to what you look at as in
;     Guerrilla, and bright light rolls off into white instead of glaring. 0 = Armageddon's own (the
;     zones' fixed exposure of 3, its curve and colour grading: brighter and more orange).
ToneMapping=1
; (live) With ToneMapping=1, Guerrilla's exposure times this: 1 = Guerrilla's, higher brighter.
Exposure=1
; (live) With ToneMapping=1, Guerrilla's sun shafts: the golden glow streaming from the sky round
;     the sun past mountains and buildings. 1 = as strong as Guerrilla's, 0 = none.
SunShafts=1
; (live) Guerrilla's sun corona: the rays, glow, halo and lens flares over the picture when you
;     look toward the sun, fading as it is hidden or sets. 1 = as strong as Guerrilla's, 0 = none.
SunCorona=1
; (live) Sharpening of the picture (contrast-adaptive, as AMD's CAS), under the HUD: 0 = none,
;     100 = strongest. Detail on the ground and buildings gets crisper without halos on edges.
Sharpen=40
; (live) With ToneMapping=1, particles (fire, smoke, sparks, screens' glow) as Guerrilla draws them:
;     in a layer of their own laid over the picture after its bloom, so they keep their colours
;     instead of burning out white and glowing. 0 = drawn into the scene as Armageddon draws them.
Particles=1
; (live) Guerrilla's fog on particles: smoke, fire, sparks and explosions take on the haze's colour
;     and fade into it far off, as Guerrilla's do. 0 = not fogged (too bright far off).
ParticleFog=1
; (live) Guerrilla's dust blowing round you on the wind: thicker the stronger the wind, none indoors.
;     0 = none. Needs a world built with this version's editor\GuerrillaBuilder.exe.
Dust=1
; (live) How fast the day goes by: game seconds for each real second (48 = a day in half an hour,
; 1 = real time). 0 = leave the clock alone. Armageddon's own clock stands still; it gets its old
; speed back in every other world.
ClockSpeed=48

; --- Size and view distance
; How wide the zones are, in metres. The world is built with Guerrilla's own zones, 511 m
; (Armageddon's are 255 m; the game already knows Guerrilla's size), so Guerrilla's whole map
; fits. Only change it to match how the world was built. 0 = the game's own. When the game starts
; this also widens the game's physics world (for every world) to hold that many zones.
ZoneSize=511
; (live) How far around you whole zones stay loaded, in metres, with their far-away ground.
; Armageddon keeps only the zones next to you (its levels are walled canyons), so past them the
; ground just stops. 500 keeps the 3 x 3 zones around you loaded, as Guerrilla does. At most just
; under two zones (the game can only track so many at once; more is lowered), but 5 x 5 zones need
; far more memory than the game gives a level. 0 = the game's own.
StreamRadius=500
; (live) How far the camera may move, in metres, before what is loaded around it moves too. Both
; games move it with the camera every frame, so the camera swinging round you (aiming, a hammer
; swing, an explosion, a vehicle's camera) near the edge of a part of the world drops a strip of
; buildings 340 m away and loads it again a moment later. Guerrilla's short view hides that; ours
; reaches far enough to see it. 25 keeps those still; 0 = every frame, as the games do.
StreamSteady=25
; (live) How far the camera draws, in metres. 475 = Guerrilla's: it draws nothing farther, so zones
; and buildings finish loading out of sight, in its haze. Up to 1500 shows more of the world, but
; also its edge and buildings appearing as they load. 0 = the zones' own (as built).
FarClip=475
; (live) 1 = draw the ground in full detail as far as Guerrilla does: its textures to 250 m and the
;     ground itself to 320 m. 0 = Armageddon's own 125 m and 150 m, beyond which only a rough far
;     ground (lower than the real one) shows, so buildings and rocks there seem to float. 0 is faster.
GroundDetail=1

; --- Buildings breaking
; Armageddon breaks buildings with the same rules as Guerrilla, but with some numbers of its own.
; These give the Guerrilla world Guerrilla's numbers. Turn one off to compare.
; 1 = explosions break buildings as far out as Guerrilla's do (a remote charge 3.75 m round it, a gas
;     barrel 4 m). 0 = only as far as Armageddon's explosions of the same name (a remote charge 2.5 m,
;     a gas barrel 3 m).
;     Read when the game starts.
GuerrillaExplosions=1
; 1 = a building's pieces that stand on the ground hold to it as in Guerrilla: the more ground a
;     piece covers, the more hits it takes before it starts to break away. 0 = Armageddon's way, where
;     every piece gives at the first hit.
GuerrillaAnchors=1
; 1 = Guerrilla's materials and loads: its super-strong steel is five times as hard to break as
;     Armageddon's, and a building's weight puts a fifth less load on its walls. 0 = Armageddon's own.
;     Every other world keeps Armageddon's.
; Both are read when the Guerrilla world loads, and again whenever you save this file while playing
; it. A building takes them as it loads, so after saving, load the zone again in the console
; (level rfg_08_10, say) to give every building the new ones.
GuerrillaMaterials=1

; --- Troubleshooting
; A frame of a second or more in the Guerrilla world is always logged, with where the game was
; stuck; that watch costs a frame nothing.
; 1 = write its routine lines to logs\rfa_mods.log (see Log= under [Loader]): every 10 seconds the
;     streaming and Wwise's memory, each effect file loaded and the first play of each effect, how
;     long the effects' sounds played, the tone mapping, the game's own debug output, frames slower
;     than a quarter of a second, and more. Read when the game starts. The switches below need it.
Log=0
; With Log=1: 1 = every 10 seconds in the Guerrilla world, logs\rfa_mods.log says what broke: how
;     many pieces broke away, groaned or collapsed, how many pieces stand anchored to the ground, and
;     how many links between touching buildings are in use; and how long the frames and the game's
;     physics took. When frames were slow, a second line names the parts of the game's own frame that
;     took the time. Also each car hitting a building or prop, and each hit on a piece. 0 = nothing.
DestructionLog=0
; With Log=1: 1 = logs\rfa_mods.log says what happens to props (barrels, crates, ...) near you in
;     the Guerrilla world: each hit (hit points before and after, killed or not, its mass and balance
;     point, how fast it moves, and where it is 0.3 s later), and each one that turns over. At most
;     60 lines. For finding a fault; 0 = nothing (the default).
PropLog=0


; -------------------------------------------------------------------------------------------------
;  guerrilla_hud: Red Faction: Guerrilla's HUD in the Guerrilla world
; -------------------------------------------------------------------------------------------------
[GuerrillaHud]
; Guerrilla's HUD in place of Armageddon's: so far its health meter and the blood that creeps in
; from the screen's corners, its reticles and ammo count, its weapon select, its minimap, and its
; world map.
; Armageddon's health ring, red screen edges and compass bar are hidden there (the top middle is
; where Guerrilla's health meter goes; Guerrilla finds the way with its minimap); its Nano Forge
; parts stay. Every other world keeps Armageddon's HUD.
; editor\GuerrillaBuilder.exe makes it from your own copy of Guerrilla (GuerrillaDir under
; [Launcher]): build it once, and again after updating RFA-Mod; until then this mod only says so in
; the log. Take it away again only with the builder (Remove): one of its files also holds the
; pictures of Armageddon's own HUD.
; The worlds it's shown in, by name: rfg is the Guerrilla world. Separate several with commas.
Worlds=rfg
; Which of Guerrilla's HUD documents to show there, separated by commas: so far rfg_ui_hud_health
; (the health meter and the blood). The builder makes each of them.
Documents=rfg_ui_hud_health
; 1 = Guerrilla's reticles and ammo count (the reticle red over an enemy, its hit markers, the
; rounds left and the rest beside it, the overheat meter) in place of Armageddon's reticle, ammo
; ring and weapon meter; 0 = Armageddon's. They need rfg_ui_hud_health above (it brings their pictures).
Reticles=1
; 1 = Guerrilla's weapon select (four plates at the bottom right, the chosen one lit with its
; name) in place of Armageddon's weapon selector, which sits where the minimap is; 0 = Armageddon's.
; It needs rfg_ui_hud_health above (it brings its pictures).
WeaponSelect=1
; 1 = Guerrilla's minimap (its map turning with the camera, the district's name, its map icons,
; its dots for the people and vehicles near you), and its safehouses' screens: the upgrade shop and the
; weapon cabinet (at a safehouse's weapon locker and at every ammo crate)
; and its world map (it pauses the game while open: W A S D or the arrow keys pan, the mouse wheel,
; Page Up / Page Down, Q / E or + / - zoom, X centres it on you, Esc or its key closes it),
; and Guerrilla's safehouse upgrade shops (the use key at a safehouse's station opens its upgrade
; screen: W / S pick, the use key or Enter buys, Esc closes; it needs guerrilla_gear); 0 = none of these. They need rfg_ui_hud_health above (it brings pictures they share).
; Their keys are under [GuerrillaKeys] below.
Map=1
; The minimap's radar sweep: each dot is brightest just after the line passes it, then fades. How
; faint a dot gets before the line comes round again, 0 to 255: Guerrilla's 0 (it fades out entirely);
; more keeps the dots showing between sweeps (128 = half strength at least).
RadarMinAlpha=0
; 1 = Guerrilla's tool tips: its help boxes as things first happen (the weapon locker opened, salvage
; picked up, a car got into, the alert raised, ...), each as often as Guerrilla played it (most once;
; mods\guerrilla_hud\tool_tips_played.txt keeps count: delete it to see them again). Some pause the
; game until TipContinue under [GuerrillaKeys] (Enter). 0 = none (Guerrilla's option).
ToolTips=1

; --- Troubleshooting (read when a HUD document loads)
; 1 = write its routine lines to logs\rfa_mods.log (see Log= under [Loader]): what Guerrilla's HUD
;     scripts find and every health update they get (their "lua:" lines), each HUD document loaded,
;     shown and hidden, the interface's memory as it grows, each screen opened and closed, each
;     pickup and tool tip
Log=0
; 1 = show Guerrilla's HUD all the time, whatever the health (the blood bright red, the meter at
;     half length), to see whether it's drawn at all. 0 = as the game goes
Test=0

[GuerrillaKeys]
; The keys of Guerrilla's own actions in the Guerrilla world. Change them in the game with F7,
; Guerrilla > Keys (it writes them here), or here: a letter, a digit, F1-F12, Tab, Enter, Space,
; Backspace, PageUp, PageDown, Insert, Home, End, Up, Down, Left, Right, Shift, Ctrl, Alt, CapsLock,
; Num0-Num9, NumPlus, NumMinus, NumStar, NumSlash, NumDot, Minus, Equals, LeftBracket, RightBracket,
; Semicolon, Quote, Comma, Period, Slash, Backslash, Mouse3, Mouse4 or Mouse5; empty for none.
; Read by guerrilla_hud and guerrilla_gear. (Before these, the map's key was [GuerrillaHud] MapKey and
; the backpack's [GuerrillaGear] BackpackKey: those are still read when a setting here is missing.)
; The world map, opened and closed: Tab, as in Re-Mars-tered. In Armageddon's own levels Tab is its
; GPS (it turns the camera to the objective); the Guerrilla world has no Armageddon objectives.
Map=Tab
; The worn backpack, switched on and off (the jetpack has none: hold jump in the air and it climbs).
Backpack=B
; The world map's zoom (Page Up / Page Down, + / - and the mouse wheel zoom too) and centring on you.
MapZoomIn=E
MapZoomOut=Q
MapCentre=X
; Up, down, left and right: the world map's pan and the safehouse screens' lists (the arrow keys work
; too, and the mouse wheel in the lists).
Up=W
Down=S
Left=A
Right=D
; Closes a tool tip that paused the game ("PRESS ENTER TO CONTINUE").
TipContinue=Enter
; The minimap's zoom, as Guerrilla's ZOOM IN / ZOOM OUT MINIMAP: from 40 to 80 metres around you.
MinimapZoomIn=PageUp
MinimapZoomOut=PageDown


; -------------------------------------------------------------------------------------------------
;  guerrilla_vehicles: driving Red Faction: Guerrilla's vehicles
; -------------------------------------------------------------------------------------------------
[GuerrillaVehicles]
; editor\GuerrillaBuilder.exe makes Guerrilla's vehicles from your own copy of Guerrilla
; (GuerrillaDir under [Launcher]); in the game, drop_car <name> in the console (drop_car Taxi).
; Armageddon's keyboard controls have no keys for driving a car, getting out of one or changing
; seats (a controller has some). These are the keys they get, by the names the console's
; controls_show_key_bindings uses (W, S, Spacebar, Shift, ...), or Mouse1..Mouse7 for a mouse
; button (Mouse3 is the middle one): Guerrilla's own. Exit also gets you out of Armageddon's own
; vehicles where the game lets you, as a controller's button does. A key you have set for one of
; them yourself is kept. Empty = leave that one as the game has it.
Accelerate=W
Brake=S
Handbrake=Spacebar
Exit=E
ChangeSeat=Mouse3
; 1 = Guerrilla's vehicles dent where they're hit, as in Guerrilla (the game's own
; vehicle_deformation_enabled, which Armageddon leaves off; its own vehicles have nothing to dent).
; 0 = they keep their shape.
Dents=1
; The worlds Guerrilla's traffic drives in (cars with drivers on Guerrilla's roads, as many as each
; zone has in Guerrilla, by day and by night), by commas; the ported world is "rfg". Empty = no traffic.
; The EDF's convoys, drive-bys and fly-bys below are in the same worlds.
TrafficWorlds=rfg
; 1 = Guerrilla's EDF convoys drive their routes (one at a time, from the end point nearest you
; that's more than 150 m away, in its hours); attack one and its escorts come after you. 0 = none.
Convoys=1
; Seconds in the world before the first convoy sets off: 600 is Guerrilla's (each end point waits
; 10 minutes after it loads). Lower it to see one sooner.
ConvoyWaitAfterLoad=600
; 1 = the EDF's ambient patrols, as in Guerrilla: scouts driving by on the roads near you (their
; gunners shoot, and they chase you once they see you), scouts driving at you to harass you, and
; Ravens flying over. 0 = none.
EdfPatrols=1
; 1 = as in Guerrilla: where the district's morale is 30 % or more, sprint on foot for 10 seconds at
; green alert (no vehicle within 50 m, outside safehouses and EDF bases) and a guerrilla drives a
; vehicle up to you, honks, and leaves it to you (once a minute at most). 0 = never.
VehicleDropOff=1
; 1 = Guerrilla's flyers fly for their NPC pilots by Guerrilla's own flight model (the EDF's fly-bys;
; a flyer you leave in the air keeps hovering while its engine runs). 0 = off: NPCs' flyers fall, as
; in Armageddon, and there are no fly-bys. Your own flying is the same either way.
NpcFlight=1
; 1 = you fly Guerrilla's flyers (the Raven, ...) with Armageddon's controls and camera: their top
; speeds, acceleration, turning, tilt and bank, and the camera that follows them, are those of
; FlyerControlsLike= (an Armageddon flyer; Mar_Flyer_2 is the NitroX). 0 = Guerrilla's own. Also in
; the F7 menus (Guerrilla > Armageddon's flyer controls), at once. Needs NpcFlight=1. NPCs fly the same.
ArmageddonFlyerControls=0
FlyerControlsLike=Mar_Flyer_2
; With Armageddon's controls the camera keeps each flyer's own place (the NitroX's is for a small
; flyer), raised this many metres (also F7 Guerrilla > Flyer camera height).
FlyerCameraRaise=1.5
; 1 = while you drive one of Guerrilla's vehicles with a gun nobody is on (a scout car, an APC), the
; gun is yours as in Guerrilla: it aims by itself at an enemy ahead of it, else points straight
; ahead, and your fire button fires it. To aim it yourself, change to the gunner's seat
; (ChangeSeat), or buy TURRET LINK with salvage (the F7 Upgrades window or a safehouse's shop; an
; upgrade of this mod's own, not Guerrilla's): from then on the gun follows your aim point while
; you drive. 0 = it follows your aim point from the start, as Armageddon's own vehicles' guns do.
DriverGunAsGuerrilla=1
; 1 = the guns on Guerrilla's vehicles are put together as Guerrilla's: its hinge motors, which hold
; a gun where it is sent, and its weights for the gun's parts (a roof gun is 5 kg, not 100).
; 0 = Armageddon's, made for its own far stronger turrets: on Guerrilla's vehicles the gun then
; swings from side to side and is thrown about in turns.
TurretHingesAsGuerrilla=1
; 1 = in Guerrilla's world (TrafficWorlds=) you get into a vehicle with the use key on foot, and out
; of it with the vehicle action's key (Exit=), as in Guerrilla. Armageddon's own player can't (its
; vehicles are entered and left by script); without this only the console's
; controls_use_vehicle_enabled lets you. 0 = Armageddon's way.
EnterVehicles=1
; 1 = with a controller, vehicles (Guerrilla's and Armageddon's) use Guerrilla's layout, whichever of
; Armageddon's controller layouts is chosen: RT accelerate, LT brake and reverse, X handbrake, A fire,
; Y get in and out, LB change seat, RB look back, right stick click camera; a walker's attacks LT, RT,
; RB, LB, its charge A. Armageddon's extras move off those: force field overcharge B, vision mode
; d-pad up, shockwave left stick click; vehicle zoom and reload go. 0 = Armageddon's layouts.
GuerrillaPad=1
; 1 = that works in Armageddon's own worlds too (its campaign's, its sandbox's), not just Guerrilla's.
; Beware: in a mission the player can then also leave a vehicle a script put him in. 0 = Guerrilla's world only.
EnterVehiclesEverywhere=1
; The vehicle interactions (vehicle_interactions.xtbl) the player is put straight into the seat of when he
; gets in, as Armageddon's scripts put him in, instead of walking to the interaction's enter point first.
; Armageddon's own vehicles (its flyers, LAVs, combugs, the bomber, ...) use Dummy, whose enter point is an
; ATV's, in or under anything bigger, so he got in late. Comma-separated; empty = walk to every one.
; (The LAVs are marked for the player as a passenger only, but Dummy has no passenger's seat: he takes
; the driver's, which has the gun.)
TeleportInteractions=Dummy
; 1 = in Guerrilla's world people who sit in a vehicle (a gunner on a turret, say) take bullets as in
; Guerrilla: shoot them and they die in their seat, a gunner thrown off his turret. You stay unhurt
; in a vehicle, as in both games. 0 = Armageddon's way, where nothing but the vehicle's end hurts
; them.
RiderDamageAsGuerrilla=1
; 1 = in Guerrilla's world the change seat key (ChangeSeat=, the middle mouse button) moves you from
; the driver's seat to the vehicle's gun and back, as in Guerrilla, so you can aim the gun yourself.
; 0 = Armageddon's way: the key does nothing.
ChangeSeatsAsGuerrilla=1
; 1 = at the gun of one of Guerrilla's vehicles your view stays on the gun, as in Guerrilla: the
; mouse turns the gun and you see where it points, so you can't look below or past what it can
; reach. 0 = Armageddon's way: the view goes where the mouse turns it and the gun follows if it can.
GunnerCameraAsGuerrilla=1
; 1 = in Guerrilla's world, when you get into a car someone sits in (a civilian's or a guerrilla's;
; the EDF's won't let you while one of them is in it), he gets out with his own exit, as in
; Guerrilla, and you get in. 0 = Armageddon's way: he stays in his seat.
CarjackAsGuerrilla=1
; 1 = Guerrilla's cars feel the ground under their wheels as in Guerrilla: a wheel ignores the car's
; own parts, things you can pass through and surfaces steeper than 60 degrees, and grips less the
; steeper the slope it stands on. 0 = Armageddon's way.
WheelRaysAsGuerrilla=1

; --- Troubleshooting
; 1 = write its routine lines to logs\rfa_mods.log (see Log= under [Loader]): each vehicle spawned
;     and each traffic car, convoy, drive-by and fly-by, the engine sounds, the guns' parts and
;     gunners, the safehouses' parked vehicles, and vehicles near you that don't show. The switches
;     below need it.
Log=0
; With Log=1: 1 = the log tells what happens when you shoot someone who sits in a vehicle (a gunner
; on a turret, say) and when you try to get into a vehicle someone is in: what the bullet met and
; whether it hurt him, and who keeps you out. A log only: the game is the same either way.
RiderLog=0
; With Log=1, more diagnoses (1 = on): DriveLog, the handling of the Guerrilla car you drive (four
; lines a second for a minute, and a line each time one of its wheels loses the ground or finds it
; again: where, and what it stood on); TurretWatchLog, where a driven vehicle's gun aims (four lines a
; second); WalkerLog, how a Guerrilla walker you drive moves; DoorLog, vehicle doors opening and
; closing.
DriveLog=0
TurretWatchLog=0
WalkerLog=0
DoorLog=0


; -------------------------------------------------------------------------------------------------
;  guerrilla_people: Red Faction: Guerrilla's people
; -------------------------------------------------------------------------------------------------
[GuerrillaPeople]
; editor\GuerrillaBuilder.exe makes Guerrilla's people from your own copy of Guerrilla
; (GuerrillaDir under [Launcher]), after the world and the weapons they need. In the
; Guerrilla world, drop_human <name> in the console puts one in front of you (drop_human EDF_Trooper).
; 1 = on. 0 = off: the people's skeletons aren't loaded (a character naming one would stop the game,
;     so also take them away: Remove in editor\GuerrillaBuilder.exe)
Enabled=1
; The worlds the people and Guerrilla's sides are for (the ported world is "rfg"): there the mod
; makes room for the people in the level and gives the teams Guerrilla's dispositions (the EDF and
; the Marauders hostile to you, civilians friendly)
Worlds=rfg
; Mason's Nano Forge light: the always-on cyan glow at his left forearm that Armageddon's player has.
; 1 = on (Armageddon's). 0 = off, as Guerrilla's Mason (it also lights the reflective tape on his coat).
; Also in the F7 menu, Graphics. Shows the next time he is made: load the level again.
MasonNanoLight=1
; How far off people stop being fully simulated and slide along their paths instead (far mode, as in Guerrilla).
; 1 = 200 m from the camera, whatever your field of view (Guerrilla's distance). 0 = the game's own measure,
;     which a wider field of view ([FOV] VerticalFov) brings nearer. Read at start-up.
FarModeRealDistance=1
; 1 = as in Guerrilla, squads made from now on carry better weapons as the campaign's levels rise: the
;     Red Faction's with the tech level, the EDF's and the Marauders' with their progression (raised by
;     liberating districts). 0 = every squad keeps the first level's weapons.
SquadLevels=1
; 1 = as in Guerrilla, at orange and red alert the civilians' squads clear off: each goes once nobody
;     sees them. 0 = they stay at every alert level.
CiviliansAtAlert=1
; 1 = write its routine lines to logs\rfa_mods.log (see Log= under [Loader]): each skeleton loaded, each
;     walker, guard, ambush, prop and story person, each path not found, reports every 30 or 60 s on the
;     walkers, the guards, the action nodes and far mode (timed each frame only with this on), and a
;     diagnosis of jumps turned down.
Log=0
; With Log=1: 1 = also a summary each minute of the lines people said and held back (guerrilla_voices'
;     own Log= under [GuerrillaVoices] lists each line).
VoiceLog=0


; -------------------------------------------------------------------------------------------------
;  guerrilla_gear: Red Faction: Guerrilla's player gear
; -------------------------------------------------------------------------------------------------
[GuerrillaGear]
; Guerrilla's upgrades are bought with salvage in the F7 window Guerrilla > Upgrades, its backpacks too
; (Wear puts one on). The key that switches the worn backpack on and off is Backpack= under
; [GuerrillaKeys] above (F7, Guerrilla > Keys); this older setting is read only where that one is missing.
; The jetpack has none: hold jump in the air and it climbs.
BackpackKey=B
; 1 = write its routine lines to logs\rfa_mods.log (see Log= under [Loader]): each gun dropped or
;     picked up, each backpack switched on and off, each melee hit, and the diagnoses that watch the
;     player's turns while standing, his guns' high-detail copies and the held weapon sounds (those
;     wrap game code that runs all the time, so they are only set up with this on).
Log=0


; -------------------------------------------------------------------------------------------------
;  guerrilla_save: saving in the world ported from Red Faction: Guerrilla
; -------------------------------------------------------------------------------------------------
[GuerrillaSave]
; The worlds where the pause menu's SAVE GAME saves the moment you are in: it closes the menu, saves
; the world in memory, then opens the save screen for you to pick a slot. There a save is never
; written into a slot on its own (Armageddon's autosave slot is the campaign's). LOAD CHECKPOINT
; goes back to the last save made.
Worlds=rfg


; -------------------------------------------------------------------------------------------------
;  guerrilla_campaign: Red Faction: Guerrilla's alert level in the world ported from it
; -------------------------------------------------------------------------------------------------
[GuerrillaCampaign]
; 1 runs Guerrilla's alert level; 0 leaves the game alone. The level shows by the minimap (green,
; yellow, orange, red) when guerrilla_hud is on. Its numbers are Guerrilla's own, which
; editor\GuerrillaBuilder.exe copies from your copy of Guerrilla when it builds the people.
Enabled=1
; The worlds it runs in.
Worlds=rfg
; 1: Guerrilla's undercover rule. While the alert level is green the EDF take you for a civilian and
; leave you alone, until you attack them, they see you inside one of their bases, or the alert rises.
; 0: they take you for an enemy at any alert level.
Undercover=1
; 1: Guerrilla's friendly fire. While the alert level is green, a Red Faction guerrilla turns on you when he hears
; you kill a civilian or a guerrilla near him (within 20 m), when you hit him three times, or when an angry one
; shouts about you near him (25 m). He calms down 20 s after the last of it. 0: they never turn on you.
FriendlyFire=1
; 1: Guerrilla's kill regions. The bottoms of its deep pits and chasms kill whoever falls in, and its
; minefields blow up whoever walks in. 0: they don't.
KillRegions=1
; 1: during a fight (the alert above green) civilians near you join the guerrillas, more of them the higher
; the district's morale, and they may rise when the EDF kill one of them. 0: they don't.
Converts=1
; 1: at orange and red alert a Red Faction squad comes to help you, bigger and sooner the higher the district's
; morale (from 40 %), and goes home at green. 0: none comes.
GuerrillaSquads=1
; 1: at yellow alert the EDF send the squad nearest you (within 160 m) after you, and at orange a second one;
; they come to where they last saw you. 0: the squads stay where they are.
AlertOrders=1
; 1: at orange and red alert the EDF send squads in after you, on foot, in vehicles (staff cars, scouts, APCs,
; tanks) and in flyers, more and heavier the further the EDF has progressed; 0: none come.
Reinforcements=1
; 1: in the Guerrilla world the game's difficulty uses Guerrilla's own numbers for combat: the damage
; you and the enemies take (from guns, vehicles, explosions, crashes and falls), the enemies' spread,
; aim and bursts, and how fast your health comes back. 0: Armageddon's numbers.
GuerrillaDifficulty=1
; 1 writes its routine lines into logs\rfa_mods.log (see Log= under [Loader]): what the alert level
; counts, each second it changes (to find out why it rose or didn't), each report that raised it,
; each squad sent or let go, each civilian who joins, each death near the player, each salvage
; pickup. Alert levels, districts' control and morale, liberations and activities are logged either
; way.
Log=0
; Still being made, off unless you want to try it: Guerrilla's script words for its missions'
; scripts (Scripts=1).
Scripts=0
; 1: Guerrilla's activities (being made). For now only the demolitions master challenges, started
; from the console at a challenge's node: rfg_dm_start je_dm_01 (the console names the one you stand
; at). 0: no activities.
Activities=1


; -------------------------------------------------------------------------------------------------
;  guerrilla_kiosks: Red Faction: Guerrilla's EDF news kiosks in the world ported from it
; -------------------------------------------------------------------------------------------------
[GuerrillaKiosks]
; 1 runs Guerrilla's kiosk code on the EDF's news kiosks (and the bars' radios): their screens show
; the EDF's pictures, or the alert picture while the alert level is yellow or above (with
; guerrilla_campaign on). 0 leaves them dark. The kiosks and Guerrilla's kiosk tables come from
; editor\GuerrillaBuilder.exe when it builds the world.
Enabled=1
; The worlds it runs in.
Worlds=rfg
; 1: the EDF's news broadcast. Near a kiosk or a bar's radio (50 m), while the alert level is green,
; a jingle plays, then three to five news lines from Guerrilla's newsreader, the screens showing what
; each is about, then the station's name and a closing tune; the next one no sooner than two minutes
; later. Lines are unlocked as you win activities. 0: the screens only.
Broadcast=1
; 1 writes its routine lines into logs\rfa_mods.log (see Log= under [Loader]): each kiosk's screens
; as they stream in and change (to find out why one stays dark), each broadcast and its lines, and a
; check of the broadcast's sound every 2 seconds while one plays.
Log=0

[GuerrillaVoices]
; 1 gives Guerrilla's people their voices: their screams, pain and panic, combat calls and everyday
; lines, as Guerrilla plays them (who may say what, how often, and which line wins). The voices come
; from editor\GuerrillaBuilder.exe when it builds the world (about 440 MB of sound files), loaded
; with the game's own sounds as it starts. 0 leaves the people silent.
Enabled=1
; 1 writes into logs\rfa_mods.log each line said or held back, and each voice loaded or let go (to
; find out why someone stays quiet); see Log= under [Loader].
Log=0

[Audio]
; RFA-Mod's own sound engine (mods\rfa_sound.dll) on OpenAL Soft (mods\openal\soft_oal.dll): 1 = it
; plays the sound banks named in Banks= instead of the game's Wwise, which goes on playing every other
; sound. Still being tested: 0 (the default) leaves every sound on Wwise, as in the game, and changes
; nothing.
OwnPlayer=0
; The banks it plays, by name (* stands for any letters; a comma between names). Ours are read from
; overrides\build\pc\cache\, Armageddon's own from the game's build\pc\cache\sounds.vpp_pc (an override of
; one in overrides\build\pc\cache\sounds.vpp_pc\ is read instead, as the game would). Empty: ours, the
; sounds of Red Faction: Guerrilla's world (rfg*). For example rfg*, wep_*, interface*, sfx_player also
; plays Armageddon's guns, menus and the player's sounds. Its voice banks (build\pc\cache\voices.vpp_pc,
; one a persona: colonel, rfpilotm01, ...) can be named too, with their lines' lip sync. Its music (mus_*)
; stays on Wwise for now, as does any sound this player can't play yet.
Banks=
; How many sounds can be heard at once (OpenAL sources); past that, the least important give way.
Voices=128
; Megabytes of decoded sounds kept in memory for the next time they play.
CacheMB=32
; 1 asks OpenAL Soft for HRTF: 3D sound made for headphones.
HRTF=0
; 1 = a moving sound's pitch rises as it comes and falls as it goes (Doppler), as sound travels; 2-10 =
; stronger. 0 = none, as Armageddon's Wwise (which has no Doppler).
Doppler=1
; 1 = a 3D sound is muffled by what stands between it and you (walls, buildings, the ground), as in
; Red Faction: Guerrilla: rays cast round you, one or two a frame, find what is near; a sound behind
; it is quieter and a little duller. 0 = nothing is muffled, as Armageddon's Wwise.
Occlusion=1
; 1 = Armageddon's own sounds, still played by Wwise, duck these as they duck Armageddon's (a voice line
; lowers the engines and guns), and its stops, pauses and mutes reach these too; its sound banks are read
; from the game's archives for that. 0 = they don't.
MirrorWwise=1
; 1 writes into logs\rfa_mods.log what it loaded and, every 10 seconds, what it is playing; see
; Log= under [Loader].
Log=0

[Mcp]
; The MCP servers, for an AI app you've set up to use them: editor\RfaEditorMcp.exe (works on the game's
; files) and live_analysis_mcp.exe (talks to the running game). 1 = they run, and the game opens the
; pipe live_analysis_mcp.exe uses, which lets programs you run on this PC, as you, read and change the
; running game (never from another PC or another Windows user). 0 = off: the game opens no pipe and
; both programs quit when started (the default).
Enabled=0
